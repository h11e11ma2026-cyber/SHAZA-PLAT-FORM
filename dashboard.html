<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حصصي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo'}body{background:#FFF8F0;padding:12px}.head{background:#fff;border:2px solid #FADDD8;border-radius:18px;padding:12px;display:flex;justify-content:space-between;max-width:500px;margin:0 auto 10px}.grid{max-width:500px;margin:0 auto;display:grid;gap:10px}.c{background:#FFFEFB;border:2px solid #FADDD8;border-radius:18px;padding:14px}.filter{display:flex;gap:6px;overflow:auto;padding:6px 0;max-width:500px;margin:0 auto}.filter button{white-space:nowrap;padding:6px 10px;border-radius:20px;border:1.5px solid #FADDD8;background:#fff;font-size:10px}.filter button.on{background:#E8919C;color:#fff}.a{display:inline-block;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:800;text-decoration:none;margin:2px}.v{background:#E8919C;color:#fff}.s{background:#fff;border:1px solid #FADDD8;color:#A67C6B}</style></head>
<body>
<div class="head"><div><b id="name">أهلا</b><br><small id="grade" style="color:#A67C6B"></small></div><a href="welcome.html" style="text-decoration:none">🏠</a></div>
<div class="filter" id="filter"></div>
<div class="grid" id="list"></div>
<script>
let cur=JSON.parse(localStorage.getItem('SHZ_CURRENT')||'null'); if(!cur)location.href='index.html'; else{name.textContent='أهلا يا '+cur.name+' 🚀'; grade.textContent=cur.grade}
let DB=JSON.parse(localStorage.getItem('SHZ_DB')||'{"courses":[]}');
if(DB.courses.length===0){DB.courses=[{title:"البلاغة - التشبيه",grade:"الصف الأول الثانوي",video:"https://youtube.com",summary:"#",sheet:"#",quiz:"#"},{title:"النحو - كان وأخواتها",grade:"الصف الثاني الإعدادي",video:"https://youtube.com",summary:"#",sheet:"#",quiz:"#"},{title:"نص غربة وحنين",grade:"الصف الثالث الثانوي",video:"https://youtube.com",summary:"#",sheet:"#",quiz:"#"},{title:"قيم إنسانية",grade:"الصف الأول الإعدادي",video:"https://youtube.com",summary:"#",sheet:"#",quiz:"#"},{title:"القراءة المتحررة",grade:"الصف الثالث الإعدادي",video:"https://youtube.com",summary:"#",sheet:"#",quiz:"#"},{title:"الأدب",grade:"الصف الثاني الثانوي",video:"https://youtube.com",summary:"#",sheet:"#",quiz:"#"}]; localStorage.setItem('SHZ_DB',JSON.stringify(DB));}
let grades=["الكل","الصف الأول الإعدادي","الصف الثاني الإعدادي","الصف الثالث الإعدادي","الصف الأول الثانوي","الصف الثاني الثانوي","الصف الثالث الثانوي"];
let active=cur?cur.grade:"الكل";
filter.innerHTML=grades.map(g=>`<button class="${g===active?'on':''}" onclick="active='${g}';render()">${g}</button>`).join('');
function render(){let cs=active==="الكل"?DB.courses:DB.courses.filter(c=>c.grade===active); filter.innerHTML=grades.map(g=>`<button class="${g===active?'on':''}" onclick="active='${g}';render()">${g}</button>`).join(''); if(cs.length===0){list.innerHTML='<div class="c" style="text-align:center;color:#C49A8A">لسه مفيش حصص</div>';return} list.innerHTML=cs.map(c=>`<div class="c"><h3 style="color:#7A5C51;font-size:13px">${c.title}</h3><small style="color:#C49A8A">${c.grade}</small><div style="margin-top:8px">${c.video?`<a class="a v" href="${c.video}" target="_blank">🎥 فيديو</a>`:''}${c.summary?`<a class="a s" href="${c.summary}" target="_blank">📄 شرح</a>`:''}${c.sheet?`<a class="a s" href="${c.sheet}" target="_blank">📝 شيت</a>`:''}${c.quiz?`<a class="a s" href="${c.quiz}" target="_blank">⭐ واجب</a>`:''}</div></div>`).join('')}render();
</script></body></html>
